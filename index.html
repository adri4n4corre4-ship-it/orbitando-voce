
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Orbitando Você</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #000;
    }

    .sky {
      width: 100%;
      height: 100vh;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.38),
          rgba(0, 0, 0, 0.38)
        ),
        url("milky-way_fitzsimmons.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
</head>

<body>

  <div class="sky"></div>

</body>
</html>
